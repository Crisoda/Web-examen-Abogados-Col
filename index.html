<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>LexPrep — Formación Jurídica de Alto Nivel</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ===== ARQUITECTURA CSS OPTIMIZADA ===== */
    :root {
      --gold: #C9A84C;
      --gold-light: #E8C86A;
      --gold-dim: rgba(201,168,76,0.12);
      --gold-border: rgba(201,168,76,0.25);
      --bg-deep: #06080C;
      --bg-base: #0D1117;
      --bg-card: #111827;
      --bg-elevated: #161E2E;
      --bg-hover: #1C2637;
      --text-primary: #F0EDE6;
      --text-secondary: #9BA3AF;
      --text-muted: #6B7280;
      --blue-jur: #3B82F6;
      --green: #10B981;
      --red: #EF4444;
      --radius: 8px;
      --radius-lg: 12px;
      --transition-fast: 150ms ease;
      --transition-smooth: 250ms cubic-bezier(0.4, 0, 0.2, 1);
      --shadow: 0 10px 30px -10px rgba(0,0,0,0.5);
    }

    /* Prevención de Flash de Contenido (FOUC) */
    body.app-loading { visibility: hidden; background: var(--bg-deep); }
    body.app-ready { visibility: visible; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    html { 
      scroll-behavior: smooth; 
      height: -webkit-fill-available;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100dvh;
      overflow-x: hidden;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Estética Profesional: Eliminación de elementos "Gamer" */
    button { 
      cursor: pointer; 
      font-family: inherit; 
      border: none; 
      outline: none;
      transition: var(--transition-fast);
      touch-action: manipulation;
    }

    input, textarea, select {
      font-family: inherit;
      font-size: 16px !important; /* Evita zoom automático en iOS */
    }

    /* ===== LAYOUT CORE ===== */
    .app-container {
      display: flex;
      min-height: 100dvh;
    }

    .sidebar {
      background: var(--bg-card);
      border-right: 1px solid rgba(255,255,255,0.05);
      width: 280px;
      height: 100dvh;
      position: sticky;
      top: 0;
      display: flex;
      flex-direction: column;
      z-index: 100;
      transition: var(--transition-smooth);
    }

    .main-content {
      flex: 1;
      min-width: 0;
      background: var(--bg-deep);
      position: relative;
    }

    /* ===== AUTH UI (SOBRIA) ===== */
    .auth-screen {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top right, rgba(201,168,76,0.03), transparent), var(--bg-deep);
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--gold-border);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-text {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: -0.02em;
    }

    .auth-title {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      margin-bottom: 8px;
      text-align: center;
    }

    .auth-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      text-align: center;
      margin-bottom: 24px;
    }

    /* ===== FORM ELEMENTS ===== */
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .form-input {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius);
      padding: 12px 16px;
      color: var(--text-primary);
      transition: var(--transition-fast);
    }
    .form-input:focus { border-color: var(--gold); outline: none; background: var(--bg-hover); }

    .btn-primary {
      width: 100%;
      background: var(--gold);
      color: #000;
      font-weight: 600;
      padding: 14px;
      border-radius: var(--radius);
      font-size: 15px;
    }
    .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }

    /* ===== NAVIGATION ===== */
    .nav-section { padding: 12px; }
    .nav-header { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; padding: 0 12px 8px; letter-spacing: 0.1em; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: var(--radius);
      color: var(--text-secondary);
      font-size: 14px;
      margin-bottom: 4px;
      width: 100%;
      text-align: left;
      background: transparent;
    }
    .nav-item:hover { background: var(--bg-elevated); color: var(--text-primary); }
    .nav-item.active { background: var(--gold-dim); color: var(--gold); font-weight: 600; }

    /* ===== COMPONENTS ===== */
    .page-container { padding: 32px; animation: fadeIn 0.4s ease-out; contain: content; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .card {
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--bg-card);
      padding: 24px;
      border-radius: var(--radius-lg);
      border-bottom: 2px solid transparent;
    }
    .stat-card.gold { border-color: var(--gold); }
    .stat-value { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; margin-bottom: 4px; }
    .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }

    /* ===== QUIZ & SIMULATOR UI ===== */
    .question-box { margin-bottom: 32px; }
    .case-context {
      background: var(--bg-elevated);
      padding: 20px;
      border-left: 3px solid var(--gold);
      border-radius: 0 var(--radius) var(--radius) 0;
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: var(--bg-elevated);
      border: 1px solid rgba(255,255,255,0.05);
      padding: 16px 20px;
      border-radius: var(--radius);
      margin-bottom: 12px;
      display: flex;
      gap: 16px;
      font-size: 14px;
      line-height: 1.6;
    }
    .option-btn:hover:not(:disabled) { border-color: var(--gold-border); background: var(--bg-hover); }
    .option-btn.selected { border-color: var(--gold); background: var(--gold-dim); }
    .option-btn.correct { border-color: var(--green); background: rgba(16,185,129,0.1); color: var(--green); }
    .option-btn.incorrect { border-color: var(--red); background: rgba(239,68,68,0.1); color: var(--red); }
    
    .option-letter {
      background: rgba(255,255,255,0.05);
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      font-weight: 700;
      flex-shrink: 0;
    }

    /* ===== RESPONSIVE OPTIMIZADO ===== */
    @media (max-width: 1024px) {
      .sidebar {
        position: fixed;
        left: -280px;
        height: 100dvh;
      }
      .sidebar.open { left: 0; box-shadow: 20px 0 50px rgba(0,0,0,0.8); }
      .main-content { margin-left: 0; }
      .page-container { padding: 20px; }
    }

    @media (max-width: 640px) {
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .auth-card { padding: 24px; }
      .logo-text { font-size: 24px; }
      .btn-primary { padding: 12px; }
    }

    /* Elementos Ocultos */
    .hidden { display: none !important; }
  </style>
</head>
<body class="app-loading">

  <div id="auth-section">
    <div id="login-screen" class="auth-screen">
      <div class="auth-card">
        <div class="auth-logo">
          <span class="logo-text">LexPrep</span>
        </div>
        <h2 class="auth-title">Acceso Institucional</h2>
        <p class="auth-subtitle">Ingrese sus credenciales para continuar su formación jurídica.</p>
        
        <div id="login-error" class="form-group hidden" style="color:var(--red); font-size:13px; text-align:center;"></div>

        <div class="form-group">
          <label class="form-label">Correo Electrónico</label>
          <input type="email" id="login-email" class="form-input" placeholder="usuario@institucion.edu.co" />
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input type="password" id="login-pass" class="form-input" placeholder="••••••••" />
        </div>
        
        <button id="btn-do-login" class="btn-primary">Iniciar Sesión</button>
        
        <div style="margin-top: 24px; text-align: center; font-size: 14px;">
          <span style="color: var(--text-muted);">¿No tiene una cuenta?</span>
          <button id="link-show-register" style="background:none; color: var(--gold); font-weight: 600; margin-left: 4px;">Registrarse</button>
        </div>
      </div>
    </div>

    <div id="register-screen" class="auth-screen hidden">
      <div class="auth-card">
        <div class="auth-logo"><span class="logo-text">LexPrep</span></div>
        <h2 class="auth-title">Crear Perfil Académico</h2>
        <div class="form-group">
          <label class="form-label">Nombre Completo</label>
          <input type="text" id="reg-name" class="form-input" />
        </div>
        <div class="form-group">
          <label class="form-label">Correo Electrónico</label>
          <input type="email" id="reg-email" class="form-input" />
        </div>
        <div class="form-group">
          <label class="form-label">Contraseña</label>
          <input type="password" id="reg-pass" class="form-input" />
        </div>
        <button id="btn-do-register" class="btn-primary">Registrar Cuenta</button>
        <button id="link-show-login" style="width:100%; background:none; color:var(--text-muted); margin-top:16px; font-size:14px;">Volver al inicio de sesión</button>
      </div>
    </div>
  </div>

  <div id="app-section" class="hidden">
    <div class="app-container">
      
      <aside id="sidebar" class="sidebar">
        <div style="padding: 32px 24px; border-bottom: 1px solid rgba(255,255,255,0.05);">
          <span class="logo-text" style="font-size: 22px;">LexPrep</span>
        </div>
        
        <nav style="flex: 1; overflow-y: auto; padding-top: 16px;">
          <div class="nav-section">
            <p class="nav-header">Evaluación</p>
            <button data-nav="dashboard" class="nav-item active">Panel Principal</button>
            <button data-nav="quiz" class="nav-item">Práctica por Materias</button>
            <button data-nav="simulator" class="nav-item">Simulacro Real</button>
          </div>
          
          <div class="nav-section">
            <p class="nav-header">Recursos</p>
            <button data-nav="tutor" class="nav-item">Tutor Jurídico IA</button>
            <button data-nav="flashcards" class="nav-item">Flashcards</button>
            <button data-nav="analytics" class="nav-item">Análisis de Desempeño</button>
          </div>
        </nav>

        <div style="padding: 16px; border-top: 1px solid rgba(255,255,255,0.05);">
          <button id="btn-logout" class="nav-item" style="color: var(--red);">Cerrar Sesión</button>
        </div>
      </aside>

      <main class="main-content">
        <header style="height: 60px; background: var(--bg-card); display: flex; align-items: center; padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,0.05);">
          <button id="mobile-toggle" style="background:none; color:var(--gold); font-size: 20px; display: none;">☰</button>
          <div style="margin-left: auto; display: flex; gap: 20px; align-items: center;">
            <div id="user-xp-display" style="font-size: 13px; font-weight: 600; color: var(--gold); background: var(--gold-dim); padding: 4px 12px; border-radius: 100px;">0 XP</div>
          </div>
        </header>

        <div id="page-content" class="page-container">
          </div>
      </main>
    </div>
  </div>

  <script>
    /* ============================================================
       ARQUITECTURA JAVASCRIPT: CLEAN & PERFORMANCE-FIRST
       ============================================================ */

    const CONFIG = {
      KEY_PREFIX: 'lexprep_',
      XP_PER_CORRECT: 50,
      SESSION_TIMEOUT: 3600000,
      PLACEHOLDER_KEY: 'CONFIG_PENDING'
    };

    // State Management
    const AppState = {
      user: null,
      currentPage: 'dashboard',
      quiz: {
        currentQuestion: null,
        history: [],
        subjectProgress: {}
      },
      cache: new Map()
    };

    /* --- DOM Elements Cache --- */
    const UI = {
      body: document.body,
      authSection: document.getElementById('auth-section'),
      appSection: document.getElementById('app-section'),
      pageContent: document.getElementById('page-content'),
      sidebar: document.getElementById('sidebar'),
      loginScreen: document.getElementById('login-screen'),
      registerScreen: document.getElementById('register-screen'),
      navItems: document.querySelectorAll('.nav-item'),
      xpDisplay: document.getElementById('user-xp-display')
    };

    /* =============================================
       CORE ENGINE
       ============================================= */

    const LexApp = {
      async init() {
        this.bindEvents();
        await this.restoreSession();
        UI.body.classList.remove('app-loading');
        UI.body.classList.add('app-ready');
      },

      bindEvents() {
        // Auth Transitions
        document.getElementById('link-show-register').onclick = () => this.showAuthScreen('register');
        document.getElementById('link-show-login').onclick = () => this.showAuthScreen('login');
        
        // Auth Actions
        document.getElementById('btn-do-login').onclick = () => this.handleLogin();
        document.getElementById('btn-do-register').onclick = () => this.handleRegister();
        document.getElementById('btn-logout').onclick = () => this.logout();

        // Navigation
        UI.navItems.forEach(item => {
          if (item.dataset.nav) {
            item.onclick = () => this.navigate(item.dataset.nav);
          }
        });

        // Mobile UI
        document.getElementById('mobile-toggle').onclick = () => {
          UI.sidebar.classList.toggle('open');
        };
      },

      showAuthScreen(screen) {
        UI.loginScreen.classList.toggle('hidden', screen !== 'login');
        UI.registerScreen.classList.toggle('hidden', screen !== 'register');
      },

      async restoreSession() {
        const sessionData = localStorage.getItem(`${CONFIG.KEY_PREFIX}session`);
        if (sessionData) {
          try {
            const parsed = JSON.parse(sessionData);
            if (Date.now() - parsed.timestamp < CONFIG.SESSION_TIMEOUT) {
              AppState.user = parsed.user;
              this.enterApp();
            } else {
              this.logout();
            }
          } catch (e) {
            this.logout();
          }
        }
      },

      async handleLogin() {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-pass').value;
        const errorEl = document.getElementById('login-error');

        // Simulación de validación (Producción usaría API)
        if (email && pass.length >= 6) {
          AppState.user = { 
            name: email.split('@')[0], 
            email, 
            xp: 1250, 
            streak: 5,
            progress: 45 
          };
          this.saveSession();
          this.enterApp();
        } else {
          errorEl.textContent = "Credenciales inválidas. Intente nuevamente.";
          errorEl.classList.remove('hidden');
        }
      },

      saveSession() {
        localStorage.setItem(`${CONFIG.KEY_PREFIX}session`, JSON.stringify({
          user: AppState.user,
          timestamp: Date.now()
        }));
      },

      enterApp() {
        UI.authSection.classList.add('hidden');
        UI.appSection.classList.remove('hidden');
        UI.xpDisplay.textContent = `${AppState.user.xp.toLocaleString()} XP`;
        this.navigate('dashboard');
      },

      logout() {
        localStorage.removeItem(`${CONFIG.KEY_PREFIX}session`);
        AppState.user = null;
        UI.appSection.classList.add('hidden');
        UI.authSection.classList.remove('hidden');
        this.showAuthScreen('login');
      },

      navigate(page) {
        AppState.currentPage = page;
        
        // UI Navigation Update
        UI.navItems.forEach(item => {
          item.classList.toggle('active', item.dataset.nav === page);
        });

        // Smooth Page Transition
        UI.pageContent.style.opacity = '0';
        
        requestAnimationFrame(() => {
          this.renderPage(page);
          UI.pageContent.style.opacity = '1';
        });

        // Auto-close sidebar on mobile
        UI.sidebar.classList.remove('open');
      },

      /* =============================================
         RENDERERS (Sin InnerHTML masivo reactivo)
         ============================================= */

      renderPage(page) {
        switch(page) {
          case 'dashboard': this.viewDashboard(); break;
          case 'quiz': this.viewQuiz(); break;
          case 'simulator': this.viewSimulator(); break;
          case 'tutor': this.viewTutor(); break;
          case 'flashcards': this.viewFlashcards(); break;
          case 'analytics': this.viewAnalytics(); break;
          default: this.viewDashboard();
        }
      },

      viewDashboard() {
        UI.pageContent.innerHTML = `
          <div class="dashboard-header" style="margin-bottom: 32px;">
            <h1 style="font-family:'Playfair Display', serif; font-size: 28px; margin-bottom: 8px;">Bienvenido, ${AppState.user.name}</h1>
            <p style="color: var(--text-muted); font-size: 14px;">Estado de su preparación para el Examen de Idoneidad Profesional.</p>
          </div>

          <div class="stats-grid">
            <div class="stat-card gold">
              <div class="stat-value">160</div>
              <div class="stat-label">Días Restantes</div>
            </div>
            <div class="stat-card" style="border-color: var(--blue-jur);">
              <div class="stat-value">${AppState.user.progress}%</div>
              <div class="stat-label">Progreso Global</div>
            </div>
            <div class="stat-card" style="border-color: var(--green);">
              <div class="stat-value">${AppState.user.streak}</div>
              <div class="stat-label">Días de Racha</div>
            </div>
          </div>

          <div class="card">
            <h3 style="font-family:'Playfair Display', serif; margin-bottom: 20px;">Actividad Sugerida</h3>
            <div style="display: flex; flex-direction: column; gap: 12px;">
              <div style="background: var(--bg-elevated); padding: 16px; border-radius: var(--radius); display: flex; align-items: center;">
                <div style="flex: 1;">
                  <h4 style="font-size: 14px; margin-bottom: 4px;">Derecho Constitucional</h4>
                  <p style="font-size: 12px; color: var(--text-muted);">Repase el Bloque de Constitucionalidad (Sentencia C-225/95)</p>
                </div>
                <button onclick="LexApp.navigate('quiz')" style="color: var(--gold); font-size: 13px; font-weight: 600;">Comenzar</button>
              </div>
            </div>
          </div>
        `;
      },

      viewQuiz() {
        UI.pageContent.innerHTML = `
          <div class="page-header" style="margin-bottom: 32px;">
            <h1 style="font-family:'Playfair Display', serif; font-size: 24px;">Módulos de Práctica</h1>
            <p style="color: var(--text-muted); font-size: 14px;">Seleccione un área del derecho para generar preguntas adaptativas.</p>
          </div>

          <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;">
            ${['Constitucional', 'Administrativo', 'Civil', 'Penal', 'Laboral', 'Ética'].map(subject => `
              <div class="card" style="margin-bottom: 0; display: flex; align-items: center; justify-content: space-between;">
                <span style="font-weight: 500;">${subject}</span>
                <button onclick="LexApp.startQuiz('${subject}')" class="btn-primary" style="width: auto; padding: 8px 16px; font-size: 12px;">Entrenar</button>
              </div>
            `).join('')}
          </div>
        `;
      },

      startQuiz(subject) {
        // Simulación de carga de pregunta IA optimizada
        UI.pageContent.innerHTML = `
          <div style="max-width: 800px; margin: 0 auto;">
            <div class="card">
              <div style="display: flex; justify-content: space-between; margin-bottom: 24px;">
                <span style="font-size: 12px; font-weight: 700; color: var(--gold); text-transform: uppercase;">Módulo: ${subject}</span>
                <span style="font-size: 12px; color: var(--text-muted);">Pregunta 1 de 10</span>
              </div>
              
              <div class="case-context">
                Un ciudadano colombiano interpone una acción de tutela contra una providencia judicial que, según su criterio, incurrió en un defecto sustantivo al aplicar una norma derogada. El juez de tutela en primera instancia niega el amparo argumentando que la tutela no procede contra sentencias judiciales.
              </div>

              <h2 style="font-size: 18px; line-height: 1.5; margin-bottom: 32px;">De acuerdo con la jurisprudencia de la Corte Constitucional (SU-050/22), ¿cuál es la tesis correcta?</h2>

              <div class="options-list">
                <button class="option-btn" onclick="LexApp.handleAnswer(this, true)">
                  <span class="option-letter">A</span>
                  <span>La tutela procede excepcionalmente contra providencias judiciales cuando se acreditan requisitos generales de procedibilidad y causales especiales de procedibilidad.</span>
                </button>
                <button class="option-btn" onclick="LexApp.handleAnswer(this, false)">
                  <span class="option-letter">B</span>
                  <span>La tutela nunca procede contra sentencias de altas cortes por respeto al principio de cosa juzgada y autonomía judicial.</span>
                </button>
                <button class="option-btn" onclick="LexApp.handleAnswer(this, false)">
                  <span class="option-letter">C</span>
                  <span>El defecto sustantivo solo es alegable mediante el recurso extraordinario de revisión ante la jurisdicción ordinaria.</span>
                </button>
              </div>
            </div>
          </div>
        `;
      },

      handleAnswer(btn, isCorrect) {
        const options = btn.parentElement.querySelectorAll('.option-btn');
        options.forEach(opt => opt.disabled = true);

        if (isCorrect) {
          btn.classList.add('correct');
          AppState.user.xp += CONFIG.XP_PER_CORRECT;
          UI.xpDisplay.textContent = `${AppState.user.xp.toLocaleString()} XP`;
        } else {
          btn.classList.add('incorrect');
        }

        // Delay para mostrar feedback antes de siguiente
        setTimeout(() => {
          this.viewQuiz();
        }, 1500);
      },

      viewSimulator() {
        UI.pageContent.innerHTML = `
          <div class="card" style="text-align: center; padding: 60px 40px;">
            <h1 style="font-family:'Playfair Display', serif; font-size: 32px; margin-bottom: 16px;">Simulacro Nacional</h1>
            <p style="color: var(--text-muted); margin-bottom: 32px; max-width: 500px; margin-inline: auto;">
              Evaluación cronometrada de 63 preguntas bajo los estándares del Consejo Superior de la Judicatura.
            </p>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px;">
              <div style="background: var(--bg-elevated); padding: 16px; border-radius: var(--radius);">
                <div style="font-size: 20px; font-weight: 700;">165</div>
                <div style="font-size: 11px; color: var(--text-muted);">MINUTOS</div>
              </div>
              <div style="background: var(--bg-elevated); padding: 16px; border-radius: var(--radius);">
                <div style="font-size: 20px; font-weight: 700;">63</div>
                <div style="font-size: 11px; color: var(--text-muted);">PREGUNTAS</div>
              </div>
              <div style="background: var(--bg-elevated); padding: 16px; border-radius: var(--radius);">
                <div style="font-size: 20px; font-weight: 700;">60%</div>
                <div style="font-size: 11px; color: var(--text-muted);">MIN. APROBACIÓN</div>
              </div>
            </div>
            <button class="btn-primary" style="max-width: 300px;">Iniciar Examen de Práctica</button>
          </div>
        `;
      },

      viewTutor() {
        UI.pageContent.innerHTML = `
          <div class="card" style="height: calc(100dvh - 200px); display: flex; flex-direction: column;">
            <div style="padding-bottom: 16px; border-bottom: 1px solid rgba(255,255,255,0.05); margin-bottom: 16px;">
              <h3 style="font-family:'Playfair Display', serif;">Tutor Jurídico Lex</h3>
              <p style="font-size: 12px; color: var(--text-muted);">Consultas especializadas con IA sobre jurisprudencia y normativa colombiana.</p>
            </div>
            <div id="chat-box" style="flex: 1; overflow-y: auto; padding-right: 10px; display: flex; flex-direction: column; gap: 16px;">
              <div style="background: var(--bg-elevated); padding: 12px 16px; border-radius: var(--radius); max-width: 80%; font-size: 14px;">
                Bienvenido. ¿Tiene alguna duda sobre los requisitos de procedencia de la tutela contra providencias judiciales o algún otro tema?
              </div>
            </div>
            <div style="margin-top: 16px; display: flex; gap: 12px;">
              <input type="text" class="form-input" placeholder="Escriba su consulta jurídica..." style="margin-bottom: 0;" />
              <button class="btn-primary" style="width: auto; padding-inline: 24px;">Enviar</button>
            </div>
          </div>
        `;
      },

      viewFlashcards() {
        UI.pageContent.innerHTML = `
          <div class="page-header" style="margin-bottom: 32px;">
            <h1 style="font-family:'Playfair Display', serif; font-size: 24px;">Flashcards</h1>
            <p style="color: var(--text-muted); font-size: 14px;">Memorización técnica de conceptos y términos latinos.</p>
          </div>
          <div style="display: flex; justify-content: center; padding: 40px 0;">
            <div class="card" style="width: 100%; max-width: 500px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: 2px solid var(--gold-border); cursor: pointer;" onclick="this.querySelector('.fc-content').textContent = 'Derecho de las personas a que sus datos sean conocidos, actualizados y rectificados en bases de datos.'">
              <span style="font-size: 10px; color: var(--gold); letter-spacing: 0.2em; font-weight: 700; margin-bottom: 20px;">CONCEPTO</span>
              <h2 class="fc-content" style="font-family:'Playfair Display', serif;">Habeas Data</h2>
              <p style="margin-top: 40px; font-size: 11px; color: var(--text-muted);">Toca para ver definición</p>
            </div>
          </div>
        `;
      },

      viewAnalytics() {
        UI.pageContent.innerHTML = `
          <div class="card">
            <h2 style="font-family:'Playfair Display', serif; margin-bottom: 24px;">Desempeño por Área</h2>
            <div style="display: flex; flex-direction: column; gap: 20px;">
              ${['C. Constitucional', 'Derecho Privado', 'Derecho Público', 'Procesal'].map(area => `
                <div>
                  <div style="display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 8px;">
                    <span>${area}</span>
                    <span style="color: var(--gold); font-weight: 600;">${Math.floor(Math.random()*40)+60}%</span>
                  </div>
                  <div style="height: 6px; background: rgba(255,255,255,0.05); border-radius: 100px; overflow: hidden;">
                    <div style="height: 100%; width: ${Math.floor(Math.random()*40)+60}%; background: var(--gold);"></div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }
    };

    // Inicialización al cargar el DOM
    document.addEventListener('DOMContentLoaded', () => LexApp.init());
  </script>
</body>
</html>
